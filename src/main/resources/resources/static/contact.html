<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatra Mitra - Contact Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #1a222b; color: #fff; padding: 20px; padding-bottom: 50px; box-sizing: border-box; }
        .back-btn { color: #f4c095; text-decoration: none; margin-bottom: 20px; display: inline-block; font-weight: 600; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 22px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        h1, h2 { font-family: 'Playfair Display', serif; color: #f4c095; margin-top: 0; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #ccc; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
        
        .contact-row { display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.3); padding: 18px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .contact-info { font-size: 0.95rem; font-weight: 600; color: #fff; word-break: break-all; margin-top: 2px; }
        .contact-label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .action-btn { background: #C1532B; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem; text-align: center; box-shadow: 0 4px 10px rgba(193, 83, 43, 0.4); display: block; }
        
        input, textarea { width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
        textarea { height: 110px; resize: none; }
        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #C1532B, #903015); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1.05rem; cursor: pointer; box-shadow: 0 4px 15px rgba(193, 83, 43, 0.4); margin-top: 5px; }
    </style>
</head>
<body>
    <a href="/home.html" class="back-btn">← Back to Hub</a>
    
    <div class="card">
        <h1>Gateway Support</h1>
        <p>Our dedicated support desk is active 24/7 to assist yatris across all Himalayan districts and checkpoints.</p>
        
        <div class="contact-row">
            <div>
                <div class="contact-label">Helpline Number</div>
                <div class="contact-info">+91 1800-YATRA-MITRA</div>
            </div>
            <a href="tel:1800000000" class="action-btn">Call Now</a>
        </div>
        
        <div class="contact-row">
            <div>
                <div class="contact-label">Official Support Email</div>
                <div class="contact-info">support@yatramitra.gov.in</div>
            </div>
            <a href="mailto:support@yatramitra.gov.in" class="action-btn">Email Us</a>
        </div>
    </div>

    <div class="card">
        <h2>Send Us a Message</h2>
        <form onsubmit="event.preventDefault(); alert('Support inquiry submitted successfully! Our team will contact you shortly.');">
            <input type="text" placeholder="Your Full Name" required>
            <input type="email" placeholder="Your Email Address" required>
            <textarea placeholder="Describe your query or assistance needed..." required></textarea>
            <button type="submit" class="submit-btn">Submit Inquiry</button>
        </form>
    </div>
</body>
</html>
