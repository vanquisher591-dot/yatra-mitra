<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatra Mitra - Emergency SOS</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #1a222b; color: #fff; padding: 20px; }
        .back-btn { color: #f4c095; text-decoration: none; margin-bottom: 20px; display: inline-block; font-weight: bold; }
        select { width: 100%; padding: 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(219, 52, 52, 0.4); color: white; border-radius: 8px; margin-bottom: 20px; font-size: 1rem; }
        select option { background: #26323F; color: white; }
        .sos-box { background: rgba(219, 52, 52, 0.1); border: 1px solid rgba(219, 52, 52, 0.3); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .sos-title { color: #ff6b6b; font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; border-bottom: 1px solid rgba(219, 52, 52, 0.2); padding-bottom: 5px; }
        .contact-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.95rem; }
        .call-btn { background: #ff6b6b; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.85rem; box-shadow: 0 2px 8px rgba(255, 107, 107, 0.4); }
    </style>
</head>
<body>
    <a href="/home.html" class="back-btn">← Back to Hub</a>
    <h2 style="color: #ff6b6b; margin-top: 0;">🚨 Emergency SOS</h2>
    <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 20px;">Select your current region for immediate SDRF and medical dispatch.</p>
    
    <select id="locationSelect" onchange="updateSOS()">
        <option value="" disabled selected>Select Current Location...</option>
        <option value="kedarnath">Kedarnath / Rudraprayag</option>
        <option value="badrinath">Badrinath / Chamoli</option>
        <option value="gangotri">Gangotri / Uttarkashi</option>
    </select>

    <div id="sosData" style="display: none;">
        <div class="sos-box">
            <div class="sos-title">🏔️ SDRF & Rescue Command</div>
            <div class="contact-row"><span>Regional SDRF Control</span> <a href="tel:1070" class="call-btn">CALL 1070</a></div>
            <div class="contact-row"><span>Mountain Helicopter Rescue</span> <a href="tel:112" class="call-btn">CALL 112</a></div>
        </div>
        <div class="sos-box">
            <div class="sos-title">🏥 Medical & Hospital</div>
            <div class="contact-row"><span id="medName">Loading...</span> <a href="tel:108" class="call-btn">CALL 108</a></div>
        </div>
        <div class="sos-box">
            <div class="sos-title">🚓 Local Police</div>
            <div class="contact-row"><span id="polName">Loading...</span> <a href="tel:100" class="call-btn">CALL 100</a></div>
        </div>
    </div>

    <script>
        const data = {
            'kedarnath': { med: 'Rudraprayag Base Hospital', pol: 'Kedarnath Police Station' },
            'badrinath': { med: 'Chamoli District Hospital', pol: 'Badrinath Checkpost' },
            'gangotri': { med: 'Uttarkashi Govt Hospital', pol: 'Gangotri Police Station' }
        };
        function updateSOS() {
            const loc = document.getElementById('locationSelect').value;
            document.getElementById('medName').innerText = data[loc].med;
            document.getElementById('polName').innerText = data[loc].pol;
            document.getElementById('sosData').style.display = 'block';
        }
    </script>
</body>
</html>
