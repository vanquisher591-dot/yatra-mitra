<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatra Mitra - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: url('https://images.unsplash.com/photo-1626544827763-d515dcb6562f?auto=format&fit=crop&w=1080&q=80') center/cover; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: rgba(38, 50, 63, 0.92); padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .logo-container { width: 70px; height: 70px; background: #C1532B; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: bold; margin: 0 auto 15px; box-shadow: 0 4px 10px rgba(193, 83, 43, 0.4); }
        h1 { color: #f4c095; font-family: 'Playfair Display', serif; margin: 0 0 5px 0; font-size: 2rem; }
        p { color: #ccc; font-size: 0.8rem; margin-bottom: 20px; letter-spacing: 1px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .tab { flex: 1; padding: 10px; color: #aaa; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .tab.active { color: #f4c095; border-bottom: 2px solid #C1532B; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        input::placeholder { color: #aaa; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #C1532B, #903015); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 10px rgba(193, 83, 43, 0.4); }
        .hidden { display: none; }
        .error-msg { background: rgba(219, 52, 52, 0.2); color: #ff6b6b; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; border: 1px solid rgba(219, 52, 52, 0.4); display: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo-container">YM</div>
        <h1>Yatra Mitra</h1>
        <p>DEVBHOOMI SMART TRAVEL TECH</p>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')" id="tab-login">Login</div>
            <div class="tab" onclick="switchTab('register')" id="tab-register">Register</div>
        </div>

        <div id="errorAlert" class="error-msg"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="email" id="loginEmail" placeholder="Registered Email ID" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Access Account</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
            <input type="text" id="regName" placeholder="Full Name" required>
            <input type="email" id="regEmail" placeholder="Email ID" required>
            <input type="password" id="regPassword" placeholder="Create Password" required>
            <button type="submit">Create Account</button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            
            if(tab === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('tab-login').classList.add('active');
            } else {
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('tab-register').classList.add('active');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const errorAlert = document.getElementById('errorAlert');

            try {
                const response = await fetch(`/api/register?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
                    method: 'POST'
                });
                const result = await response.text();

                if (response.ok) {
                    localStorage.setItem('yatraUserEmail', email);
                    window.location.href = '/home.html';
                } else {
                    errorAlert.style.display = 'block';
                    errorAlert.innerText = result; // Triggers if email already exists in database
                }
            } catch (err) {
                errorAlert.style.display = 'block';
                errorAlert.innerText = 'Database connection error.';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorAlert = document.getElementById('errorAlert');

            try {
                const response = await fetch(`/api/login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
                    method: 'POST'
                });
                const result = await response.text();

                if (response.ok) {
                    localStorage.setItem('yatraUserEmail', email);
                    window.location.href = '/home.html';
                } else {
                    errorAlert.style.display = 'block';
                    errorAlert.innerText = result; // Triggers if account not found or password incorrect
                }
            } catch (err) {
                errorAlert.style.display = 'block';
                errorAlert.innerText = 'Database connection error.';
            }
        }
    </script>
</body>
</html>
