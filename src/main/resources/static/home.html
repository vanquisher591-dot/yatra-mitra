<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatra Mitra - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #1a222b; color: #fff; padding-bottom: 40px; }
        .header { background: rgba(38, 50, 63, 0.9); padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { margin: 0; font-family: 'Playfair Display', serif; color: #f4c095; font-size: 1.5rem; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; max-width: 600px; margin: 0 auto; margin-top: 10px; }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 22px 15px; text-align: center; text-decoration: none; color: white; transition: 0.3s; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .icon { font-size: 2rem; margin-bottom: 8px; }
        .title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
        .subtitle { font-size: 0.7rem; color: #aaa; line-height: 1.2; }
        .sos-card { border-color: rgba(219, 52, 52, 0.4); background: rgba(219, 52, 52, 0.05); }
        .profile-card { border-color: rgba(244, 192, 149, 0.4); background: rgba(244, 192, 149, 0.05); }
    </style>
</head>
<body>
    <div class="header">
        <h1>YatraMitra.</h1>
        <div style="font-size: 0.85rem; color: #aaa;" id="welcomeUser">Welcome, Yatri</div>
    </div>
    
    <div class="grid-container">
        <a href="/services.html" class="glass-card">
            <div class="icon">🏔️</div>
            <div class="title">Explore</div>
            <div class="subtitle">Destinations & Booking</div>
        </a>
        
        <a href="/weather.html" class="glass-card">
            <div class="icon">⛅</div>
            <div class="title">Live Weather</div>
            <div class="subtitle">Forecast & Alerts</div>
        </a>
        
        <a href="/maps.html" class="glass-card">
            <div class="icon">🗺️</div>
            <div class="title">Route Maps</div>
            <div class="subtitle">Navigation & Trails</div>
        </a>
        
        <a href="/emergency.html" class="glass-card sos-card">
            <div class="icon">🚨</div>
            <div class="title" style="color: #ff6b6b;">Emergency SOS</div>
            <div class="subtitle">SDRF, Police & Medical</div>
        </a>
        
        <a href="/about.html" class="glass-card">
            <div class="icon">👥</div>
            <div class="title">About Us</div>
            <div class="subtitle">Mission & Team</div>
        </a>
        
        <a href="/contact.html" class="glass-card">
            <div class="icon">📞</div>
            <div class="title">Contact</div>
            <div class="subtitle">Gateway Support</div>
        </a>
    </div>

    <!-- Prominent Dedicated Profile Button at the bottom -->
    <div style="max-width: 570px; margin: 0 auto; padding: 0 20px;">
        <a href="/profile.html" class="glass-card profile-card" style="display: block; display: flex; align-items: center; justify-content: space-between; padding: 18px 25px; box-sizing: border-box;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="icon" style="margin: 0; font-size: 1.8rem;">👤</div>
                <div style="text-align: left;">
                    <div class="title" style="color: #f4c095; font-size: 1.1rem;">My Account & Profile</div>
                    <div class="subtitle">View personal details, wallet credits & trip history</div>
                </div>
            </div>
            <div style="font-size: 1.2rem; color: #f4c095;">→</div>
        </a>
    </div>

    <script>
        const userEmail = localStorage.getItem('yatraUserEmail');
        if(userEmail) {
            document.getElementById('welcomeUser').innerText = 'User: ' + userEmail.split('@')[0];
        }
    </script>
</body>
</html>
